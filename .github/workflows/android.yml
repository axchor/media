name: Build Media3 ExoPlayer Demo

on:
  workflow_dispatch:
  push:
    branches: [ release ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: List Gradle projects
        run: ./gradlew projects

      - name: Build demo APK
        run: ./gradlew :demos:main:assembleDebug

      - name: Show build output tree
        run: find . -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: media3-demo-apk
          path: demos/main/build/outputs/apk/debug/main-debug.apk
