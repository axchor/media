name: Build Media3 ExoPlayer Demo

on:
  workflow_dispatch:
  push:
    branches: [ release ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: List Gradle projects
        run: ./gradlew projects

      - name: Build demo APKs
        run: ./gradlew :demo:main:assembleDebug

      - name: Show build output tree
        run: find . -type f -name "*.apk"

      - name: Upload demo APKs
        uses: actions/upload-artifact@v4
        with:
          name: media-demo-apks
          path: |
            demos/main/buildout/outputs/apk/withDecoderExtensions/debug/demo-withDecoderExtensions-debug.apk
            demos/main/buildout/outputs/apk/noDecoderExtensions/debug/demo-noDecoderExtensions-debug.apk
